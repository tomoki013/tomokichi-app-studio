version: 1
project:
  name: tomokichi-studio
  type: other
  owner: tomokichi
  platforms: [web, api]
repository:
  default_branch: main
mcp:
  allowed:
    - tomokichi-dev-rules-mcp
checks:
  required:
    - lint
    - test
    - build
    - secret-scan
    - dependency-scan
    - diff
  commands:
    lint: pnpm run lint
    test: pnpm run test
    build: pnpm run build
security:
  level: application
testing:
  level: application
maturity: production
production:
  enabled: true
deployment:
  type: cloudflare
  environments:
    - preview
    - production
