version: 2

# Two ecosystems, both grouped: a single PR per ecosystem per week keeps the
# review surface small enough that updates actually get looked at.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    # pnpm workspace: scanning / covers every package in pnpm-workspace.yaml
    # and updates the root lockfile with it. Listing /apps/* and /packages/*
    # as well made a second, lockfile-less PR per package that could never
    # pass `pnpm install --frozen-lockfile`.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    # Majors that the toolchain cannot take yet. Each PR would fail, and the
    # per-app ones cannot update the root lockfile either. Drop an entry once
    # the blocker ships support:
    # - typescript 7: @astrojs/check peers typescript "^5 || ^6".
    # - vitest 5: @cloudflare/vitest-pool-workers peers vitest "^4.1.0".
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
